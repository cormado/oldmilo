<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Espacio para tu ícono -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <title>@Plaices</title>
    
    <style>
        /* ================= RESETS & GLOBALES ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #0d0d0d;
            color: #ffffff;
            position: relative;
        }

        /* ================= FONDO REACTIVO ================= */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Mezcla de colores tipo fondo de iPhone interactuando con el mouse */
            background: 
                radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(112, 10, 255, 0.4) 0%, transparent 40%),
                radial-gradient(circle at calc(100% - var(--mouse-x)) calc(100% - var(--mouse-y)), rgba(255, 42, 133, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(20, 160, 255, 0.3) 0%, transparent 60%);
            transition: background 0.1s ease;
        }

        /* ================= PANTALLA INTRO ================= */
        #intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0d0d0d;
            transition: opacity 0.8s ease;
        }

        /* Bola 3D con "pintura infinita" */
        .ball {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #7000ff, #00f0ff, #ff007f);
            background-size: 300% 300%;
            box-shadow: 
                inset -15px -15px 30px rgba(0,0,0,0.5), 
                inset 10px 10px 20px rgba(255,255,255,0.4),
                0 10px 30px rgba(0,0,0,0.8);
            cursor: pointer;
            animation: drip 3s ease infinite, float 4s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .ball:hover {
            transform: scale(1.05);
        }

        /* Animación clic de la bola */
        .ball.jump-drop {
            animation: jumpDrop 1.5s cubic-bezier(0.5, 0, 0.1, 1) forwards !important;
        }

        .click-text {
            margin-top: 30px;
            font-size: 1.2rem;
            letter-spacing: 3px;
            font-weight: 200;
            opacity: 0.7;
            animation: pulse 2s infinite;
        }

        /* ================= CONTENEDOR PRINCIPAL ================= */
        #main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        #main-content.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Glasmorfismo y borde neón que sigue el mouse */
        .glass-card {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* El borde brillante dinámico */
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px; /* Grosor del borde */
            background: radial-gradient(
                120px circle at var(--card-mouse-x) var(--card-mouse-y), 
                rgba(255,255,255,0.8), 
                transparent 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
        }

        /* ================= ELEMENTOS DE LA TARJETA ================= */
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            /* Fallback visual si profile.png no existe aún */
            background: #333; 
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .social-icons svg, .social-icons .dots {
            width: 28px;
            height: 28px;
            fill: #fff;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
        }

        .social-icons svg:hover, .social-icons .dots:hover {
            transform: scale(1.1);
            opacity: 1;
        }

        /* Botones */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
        }

        footer a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        footer a:hover {
            color: rgba(255,255,255,0.8);
        }

        /* ================= MODALES ================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(30px);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }
        
        .close-modal:hover { color: #fff; }

        .modal-title {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* Caja copiable de contacto */
        .copy-box {
            display: flex;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
        }

        .copy-box input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 15px;
            width: 100%;
            outline: none;
        }

        .copy-box button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            padding: 0 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .copy-box button:hover {
            background: rgba(255,255,255,0.3);
        }

        /* ================= KEYFRAMES ================= */
        @keyframes drip {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes jumpDrop {
            0% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-40px) scale(0.9); }
            100% { transform: translateY(120vh) scale(0.5); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- Fondo interactivo -->
    <div class="background" id="bg"></div>

    <!-- PANTALLA DE CARGA / INTRO -->
    <div id="intro">
        <div class="ball" id="magic-ball"></div>
        <div class="click-text">CLICK ME</div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content">
        <div class="glass-card" id="card">
            
            <img src="profile.png" alt="Profile" class="profile-pic" onerror="this.src='https://via.placeholder.com/100/333333/FFFFFF?text=Plaices'">
            
            <h1>@plaices</h1>
            
            <div class="social-icons">
                <!-- Icono Twitch -->
                <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                
                <!-- Icono 3 Puntos -->
                <svg class="dots" id="btn-more" viewBox="0 0 24 24"><path d="M6 12a2 2 0 11-4 0 2 2 0 014 0zm8 0a2 2 0 11-4 0 2 2 0 014 0zm8 0a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                
                <!-- Icono YouTube -->
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>

            <div class="buttons">
                <button class="btn" id="btn-about">Sobre mi</button>
                <button class="btn" id="btn-contact">Contacto</button>
                <button class="btn">MiloPack</button>
            </div>

            <footer>
                <a href="https://kentono.com" target="_blank">made by kentono</a>
            </footer>
        </div>
    </div>

    <!-- MODAL: REDES EXTRA (Instagram) -->
    <div class="modal-overlay" id="modal-more">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title">Más Redes</h2>
            <div style="display:flex; justify-content:center; gap:20px;">
                <!-- Instagram -->
                <svg width="40" height="40" fill="#fff" viewBox="0 0 24 24" style="cursor:pointer;"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            </div>
        </div>
    </div>

    <!-- MODAL: SOBRE MI -->
    <div class="modal-overlay" id="modal-about">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title">Sobre mi</h2>
            <p style="font-size: 0.9rem; color: #ccc; line-height: 1.5;">Lorem Ipsum.</p>
        </div>
    </div>

    <!-- MODAL: CONTACTO -->
    <div class="modal-overlay" id="modal-contact">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 class="modal-title">Contacto</h2>
            <div class="copy-box">
                <input type="text" id="contact-text" value="Lorem Ipsum" readonly>
                <button id="btn-copy">Copy</button>
            </div>
        </div>
    </div>

    <script>
        // 1. ANIMACIÓN DEL TÍTULO EN LA PESTAÑA (Efecto máquina de escribir infinito)
        const titleText = "@Plaices";
        let titleIndex = 0;
        let isDeleting = false;
        
        function animateTitle() {
            let currentText = titleText.substring(0, titleIndex) || '\u200B';
            document.title = currentText;

            if (!isDeleting && titleIndex < titleText.length) {
                titleIndex++;
                setTimeout(animateTitle, 300);
            } else if (isDeleting && titleIndex > 0) {
                titleIndex--;
                setTimeout(animateTitle, 150);
            } else {
                isDeleting = !isDeleting;
                setTimeout(animateTitle, 1000); // Pausa al final de escribir/borrar
            }
        }
        animateTitle();

        // 2. EFECTO DEL MOUSE EN EL FONDO GENERAL
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            // Actualiza las variables globales para el fondo fluido
            document.documentElement.style.setProperty('--mouse-x', `${x}%`);
            document.documentElement.style.setProperty('--mouse-y', `${y}%`);
        });

        // 3. EFECTO DE NEÓN EN LA TARJETA (Rastrea el mouse DENTRO de la tarjeta)
        const card = document.getElementById('card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            // Actualiza las variables específicas de la tarjeta
            card.style.setProperty('--card-mouse-x', `${x}px`);
            card.style.setProperty('--card-mouse-y', `${y}px`);
        });
        
        // Mantiene el neón en el centro si el mouse sale
        card.addEventListener('mouseleave', () => {
            card.style.setProperty('--card-mouse-x', `50%`);
            card.style.setProperty('--card-mouse-y', `50%`);
        });

        // 4. LÓGICA DE LA BOLA INTRODUCTORIA
        const ball = document.getElementById('magic-ball');
        const introSection = document.getElementById('intro');
        const mainContent = document.getElementById('main-content');

        ball.addEventListener('click', () => {
            // Animación de la bola saltando y cayendo
            ball.classList.add('jump-drop');
            
            // Espera a que termine de caer para mostrar la página
            setTimeout(() => {
                introSection.style.opacity = '0';
                setTimeout(() => {
                    introSection.style.display = 'none';
                    mainContent.classList.add('visible');
                }, 800);
            }, 600);
        });

        // 5. LÓGICA DE LOS MODALES
        const modalMore = document.getElementById('modal-more');
        const modalAbout = document.getElementById('modal-about');
        const modalContact = document.getElementById('modal-contact');

        // Función abrir
        function openModal(modal) { modal.classList.add('active'); }
        // Función cerrar
        function closeModal(modal) { modal.classList.remove('active'); }

        // Botones de apertura
        document.getElementById('btn-more').addEventListener('click', () => openModal(modalMore));
        document.getElementById('btn-about').addEventListener('click', () => openModal(modalAbout));
        document.getElementById('btn-contact').addEventListener('click', () => openModal(modalContact));

        // Botones de cierre (X y click fuera)
        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', function() {
                closeModal(this.closest('.modal-overlay'));
            });
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if(e.target === this) closeModal(this);
            });
        });

        // 6. COPIAR TEXTO EN PORTAPAPELES
        const btnCopy = document.getElementById('btn-copy');
        const contactText = document.getElementById('contact-text');

        btnCopy.addEventListener('click', () => {
            contactText.select();
            contactText.setSelectionRange(0, 99999); // Para móviles
            navigator.clipboard.writeText(contactText.value).then(() => {
                btnCopy.innerText = "Copied!";
                setTimeout(() => { btnCopy.innerText = "Copy"; }, 2000);
            });
        });

    </script>
</body>
</html>
